<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SILAB</title>

    <!-- GOOGLE FONT: PLUS JAKARTA SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS AUTHENTICATION -->
    <link rel="stylesheet" href="../../CSS/auth/auth.css">

</head>

<body>

    <main class="login-container">

        <!-- =================================
            BAGIAN KIRI: BACKGROUND DAN LOGO
        ================================== -->

        <section class="visual-panel">

            <!-- BACKGROUND LABORATORIUM -->
            <img
                src="../../Assets/Background.svg"
                alt=""
                class="visual-background"
            >

            <!-- IDENTITAS SILAB -->
            <div class="brand">

                <!-- LOGO -->
                <img
                    src="../../Assets/Logo_RPL.svg"
                    alt="Logo SILAB"
                    class="brand-logo"
                >

                <!-- NAMA APLIKASI -->
                <div class="brand-text">

                    <h1>SILAB</h1>

                    <p>Sistem Peminjaman Laboratorium</p>

                    <p>Universitas Khairun</p>

                </div>

            </div>

        </section>


        <!-- =================================
            BAGIAN KANAN: FORM LOGIN
        ================================== -->

        <section class="form-panel">

            <div class="form-content">

                <!-- JUDUL LOGIN -->
                <header class="form-header">

                    <h2>Selamat Datang!</h2>

                    <p>Silahkan login untuk melanjutkan</p>

                </header>


                <!-- FORM LOGIN -->
                <!--bagian ini diubah laili ya-->
                <form class="login-form" id="loginForm">

                    <!-- INPUT NIP/NPM -->
                    <div class="input-group">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            name="identifier"
                            placeholder="NIP/NPM"
                            inputmode="numeric"
                            pattern="[0-9]+"
                            title="NIP/NPM hanya boleh berisi angka."
                            autocomplete="username"
                            required
                        >

                    </div>

                    <!-- INPUT PASSWORD -->
                    <div class="input-group">

                        <i class="bi bi-lock"></i>

                        <!--autocomplete di ubah dari off jadi "current-password - laili"-->
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <!-- INGAT SAYA -->
                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>Ingat Saya</span>

                    </label>

                    <!--penyesuaian rute login - laili-->
                    <!--Pengalihan akan dilakukan JavaScript berdasarkan hasil pemeriksaan identitas dan password.-->
                    <!-- TOMBOL LOGIN -->
                    <button type="submit" class="btn-login">
                        Login
                    </button>

                    <!--PESAN KESALAHAN - laili-->
                    <p id="loginMessage" role="alert"></p>

                </form>


                <!-- FOOTER LOGIN -->
                <div class="form-footer">

                    <p>
                        Belum punya akun?
                        <a href="register.html">Daftar di sini</a>
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
